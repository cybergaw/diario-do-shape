<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<title>Diário do Shape</title>
<style>
@font-face{font-family:"Doto";src:url(fonts/doto-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Doto";src:url(fonts/doto-latin-900-normal.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Hanken Grotesk";src:url(fonts/hanken-grotesk-latin-300-normal.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Hanken Grotesk";src:url(fonts/hanken-grotesk-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Hanken Grotesk";src:url(fonts/hanken-grotesk-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Hanken Grotesk";src:url(fonts/hanken-grotesk-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,sans-serif;overscroll-behavior-y:none}
*{-webkit-tap-highlight-color:transparent}
img{max-width:100%}[hidden]{display:none!important}
</style>
<style>
/* Layout: coluna única de bolso no escuro; cartões-chave como campos de luz difusa, números em matriz de pontos, réguas de marcação no lugar de barras, abas numa pílula flutuante */
:root{
  --bg:#050506; --surface:#111113; --raise:#18181B; --field:#1C1C20; --ink:#F3F1EC; --muted:#8E8E95; --line:#26262B;
  --accent:#DDF46A; --accent-ink:#0A0A0A; --accent-soft:rgba(221,244,106,.12);
  --kcal:#FF7A3D; --kcal-soft:rgba(255,122,61,.15); --prot:#DDF46A; --carb:#FF9A5C; --fat:#C58BFF;
  --bad:#FF6464; --good:#7EE2A8; --equip:#3A3A41; --tick:rgba(255,255,255,.2);
  --display:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --dot:"Doto","Courier New",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:18px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.big{font-family:var(--display);font-weight:700;font-size:46px;line-height:.95;font-variant-numeric:tabular-nums}
.big small{font-size:20px;font-weight:600;color:var(--muted);margin-left:3px}
.mid{font-family:var(--display);font-weight:600;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.over>i{background:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--kcal-soft);color:var(--kcal)}
.pill.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}
.week b{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}
.week b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week b.today{border-color:var(--ink)}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button.armed{color:var(--bad);border-color:var(--bad)}
button.small{padding:6px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:99px;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.ex{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(3,minmax(0,1fr)) auto;gap:6px;align-items:end}
.ex input{padding:9px 8px}
.exb{display:flex;flex-direction:column;gap:8px;padding:12px 0 4px}
.exb+.exb{border-top:1px solid var(--line)}
.exh{display:flex;gap:6px;align-items:center}
.exh input{font-weight:600}
.sets{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}
.sets .hd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sets .sn{font-family:var(--display);font-size:20px;font-weight:600;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.sets input{padding:9px 10px;text-align:center;font-variant-numeric:tabular-nums}
.setbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.exlog{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.now{border-color:var(--accent)}
.clock{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.exname{font-size:28px;line-height:1.05}
button.go{padding:15px;font-size:16px;width:100%}
.cur{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--bg)}
.stps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stpr{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:4px;align-items:center}
.stpr input{text-align:center;font-family:var(--display);font-size:28px;font-weight:700;padding:5px 2px;background:var(--surface)}
.stpr button{height:48px;font-size:22px;padding:0;line-height:1}
.rest{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rest .lbl,.rest .note{color:inherit;opacity:.85}
.rest .big{font-size:56px}
.rest .bar{background:color-mix(in srgb,var(--accent-ink) 25%,transparent)}
.rest .bar>i{background:var(--accent-ink)}
.rest button{background:transparent;color:inherit;border-color:currentColor}
.rest button.primary{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.sl{display:flex;flex-direction:column}
.setrow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.setrow:first-child{border-top:0}
.setrow.atual{font-weight:700;color:var(--accent)}
.setrow span:last-child{color:var(--accent);font-weight:700}
.hint{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.hint.keep{background:var(--kcal-soft)}
.mini{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:12px;align-items:center;font-size:14px}
.mini svg{width:100%;height:auto;display:block;background:var(--bg);border-radius:8px}
.chip.ok{border-color:var(--accent);color:var(--accent)}
input[type=search]{font-size:16px}
.flist{display:flex;flex-direction:column}
.fr{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.flist .fr:first-child{border-top:0}
.frb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;border-radius:8px;background:transparent;padding:9px 4px;font-weight:400}
.frb:hover{background:var(--bg)}
.frb .t{font-weight:600;overflow-wrap:anywhere}
.frb .s{font-size:13px;color:var(--muted)}
.qadd{width:40px;height:40px;padding:0;font-size:20px;line-height:1;flex:none}
.selp{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--bg)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:10px}
.qrow input,.qrow select{background:var(--surface)}
.prev{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.mchips{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.mchips span{padding:3px 9px;border-radius:99px;background:var(--bg)}
.mchips b{color:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.macro{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;font-size:13px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav strong{font-family:var(--display);font-size:22px;text-transform:capitalize}
.meal h3{margin-top:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;border-radius:0;background:transparent;padding:12px 2px 14px;font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:3px solid transparent}
.tabs button.on{color:var(--ink);border-top-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted)}
.guia{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;background:var(--bg);border-radius:12px;padding:12px}
.gfig{display:flex;flex-direction:column;gap:8px;min-width:0}
.gfig svg{width:100%;height:auto;display:block;background:var(--surface);border-radius:10px}
.gtxt{min-width:0}
.gtxt h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.gtxt h4.ev{color:var(--bad)}
.gtxt ol,.gtxt ul{margin:0 0 12px;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.gtxt ul.evite{margin-bottom:0}
.gtxt .evite li::marker{color:var(--bad)}
.gbtn{align-self:flex-start;color:var(--accent)}
@media (max-width:560px){.guia{grid-template-columns:1fr}}
@media (max-width:420px){.big{font-size:40px}.ex{grid-template-columns:repeat(3,minmax(0,1fr)) auto}.ex .exn{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s ease}}
/* ---------- linguagem visual: luz difusa no escuro ---------- */
body{background:var(--bg);font-family:var(--body);letter-spacing:-.005em;padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:-20vh -20vw auto;height:70vh;z-index:-1;pointer-events:none;background:radial-gradient(50% 50% at 70% 30%,rgba(120,60,140,.22),transparent 70%),radial-gradient(40% 40% at 20% 10%,rgba(90,140,110,.16),transparent 70%)}
.brand{font-family:var(--body);font-weight:300;font-size:32px;text-transform:lowercase;letter-spacing:-.04em}
.brand span{color:var(--ink);font-weight:600}
h2{font-family:var(--body);font-weight:400;font-size:25px;text-transform:none;letter-spacing:-.025em;line-height:1.1}
h3,.lbl{font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:20px}
.big{font-family:var(--dot);font-weight:900;font-size:64px;letter-spacing:.01em;line-height:.85}
.big small{font-family:var(--body);font-size:15px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:6px}
.mid{font-family:var(--body);font-weight:300;font-size:28px;letter-spacing:-.03em}
.clock{font-family:var(--dot);font-weight:900;font-size:36px}
.note{color:var(--muted)}
/* régua de marcação */
.bar{height:14px;border-radius:0;overflow:visible;position:relative;background:repeating-linear-gradient(90deg,var(--tick) 0 1.5px,transparent 1.5px 6px)}
.bar>i{position:relative;border-radius:0;--c:var(--ink);background:repeating-linear-gradient(90deg,var(--c) 0 1.5px,transparent 1.5px 6px)}
.bar>i::after{content:"";position:absolute;right:-2px;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--accent)}
.bar.over>i{--c:var(--bad)}
/* controles */
button{border-radius:999px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font-weight:500}
button.primary{background:var(--ink);color:#0A0A0A;border-color:var(--ink);font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.go{display:flex;align-items:center;justify-content:center;gap:10px}
button.primary.go::after{content:"+";display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#0A0A0A;color:var(--ink);font-size:17px;line-height:1}
button.armed{color:var(--bad);border-color:var(--bad)}
.chip{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.chip.on{background:var(--ink);color:#0A0A0A;border-color:var(--ink)}
.chip.ok{border-color:var(--accent);color:var(--accent)}
input,select,textarea{background:var(--field);border:1px solid transparent;border-radius:14px;color:var(--ink)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
label{font-weight:400;color:var(--muted)}
.pill{background:rgba(255,255,255,.1);color:var(--ink);font-weight:500}
.pill.warn{background:var(--kcal-soft);color:#FFB08A}
.pill.bad{background:transparent;border:1px solid var(--bad);color:#FF9A9A}
.week b{border:1px solid #3A3A40;font-weight:500;width:34px;height:34px}
.week b.on{background:var(--ink);color:#0A0A0A;border-color:var(--ink)}
.week b.today{border-color:var(--accent)}
.week div{color:var(--muted);font-weight:400}
.daynav strong{font-family:var(--body);font-weight:400;font-size:20px;letter-spacing:-.02em}
.sets .sn{font-family:var(--dot);font-weight:900}
.stpr input{font-family:var(--dot);font-weight:900;font-size:30px;background:var(--surface)}
.stpr button{border-radius:14px}
.cur,.selp,.guia{background:var(--raise);border-radius:22px}
.prev{background:var(--surface);border-color:var(--line);border-radius:16px}
.gfig svg,.mini svg{background:#0C0C0E;border-radius:16px}
.hint{border-radius:16px;color:var(--ink)}
.mchips span{background:var(--surface)}
.setrow.atual{color:var(--accent)}
.chart text{fill:var(--muted)}
/* abas: pílula flutuante */
.tabs{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding:6px;border:1px solid var(--line);border-radius:999px;background:rgba(18,18,21,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.tabs nav{gap:2px}
.tabs button{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;border:0;border-radius:999px;padding:11px 2px;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#0A0A0A}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#0A0A0A;border-radius:999px;padding:11px 18px;font-weight:500}
/* campos de luz (cartões em gradiente) */
.g{border:0;color:#fff;--ink:#F7F5F0;--muted:rgba(255,255,255,.74);--line:rgba(255,255,255,.16);--tick:rgba(255,255,255,.3);overflow:hidden;isolation:isolate}
.g .pill{background:rgba(255,255,255,.18);color:#fff}
.g .chip{border-color:rgba(255,255,255,.28);color:#fff;background:rgba(0,0,0,.12)}
.g button.ghost{color:rgba(255,255,255,.8)}
.g .item{border-color:rgba(255,255,255,.14)}
.g .bar>i{--c:#fff}
.g-pink{background:radial-gradient(90% 70% at 90% 0%,#ff6cb5 0%,#d0217a 28%,#5a0b35 62%,#16040e 100%)}
.g-green{background:radial-gradient(95% 80% at 50% 115%,#a2e3c2 0%,#4f9e7b 28%,#123629 62%,#060c09 100%)}
.g-red{background:radial-gradient(70% 70% at 35% 0%,#1d0306 0%,#7c1006 34%,#e22d0c 70%,#ff7b30 100%)}
.g-blue{background:radial-gradient(75% 60% at 50% 70%,#8ec4ff 0%,#3157e0 32%,#141f6e 68%,#070a22 100%)}
.g-lime{background:radial-gradient(65% 60% at 62% 78%,#7a32ff 0%,#9a52f5 18%,#b9ec2c 62%,#eaf43d 100%);color:#0B0B0B;--ink:#0B0B0B;--muted:rgba(0,0,0,.62);--line:rgba(0,0,0,.14)}
.g-lime button.primary{background:#0B0B0B;color:#F3F1EC;border-color:#0B0B0B}
.g-lime button.primary.go::after{background:#F3F1EC;color:#0B0B0B}
.g-lime .hint{background:rgba(255,255,255,.35)}
.g .hint{background:rgba(0,0,0,.22);color:#fff}
.g-lime .hint{color:#0B0B0B}
.g-day{background:radial-gradient(110% 70% at 100% 0%,#5fd3ec 0%,#1f7f99 26%,#0e3943 58%,#061316 100%)}
.ja{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:18px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#4f74ff 0%,#2338a8 40%,#0d1446 100%)}
.ja .lbl{color:rgba(255,255,255,.8)}
.ja-t{font-size:13px;font-weight:600}
.ja-i{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding-top:6px;border-top:1px solid rgba(255,255,255,.16)}
.ja-i .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ja-i .num{color:rgba(255,255,255,.78);text-align:right;flex:none}
.bm{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.bm p{margin:0}
.esc{position:relative;display:flex;gap:3px;height:10px;margin-top:4px}
.esc span{height:100%;border-radius:3px;background:rgba(255,255,255,.16)}
.esc span.bom{background:rgba(221,244,106,.45)}

function figura(n,k){
  const g=GUIA[n];if(!g)return '';const A=g.a,B=g.b||{},P={};
  for(const j in A){const b=B[j]||A[j];P[j]=[A[j][0]+(b[0]-A[j][0])*k,A[j][1]+(b[1]-A[j][1])*k]}
  const f=x=>(+x).toFixed(1);
  const L=(p,q,c,w)=>`<line x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const INK='var(--ink)',FAR=g.front?INK:'var(--muted)',EQ='var(--equip)',AC='var(--accent)';
  const ft=(a,kn,side)=>{if(g.front)return [a[0]+side*7,a[1]];const dx=a[0]-kn[0],dy=a[1]-kn[1],l=Math.hypot(dx,dy)||1;const s=g.flip?-1:1;return [a[0]+s*dy/l*9,a[1]-s*dx/l*9]};
  let o=`<line x1="4" x2="196" y1="130" y2="130" stroke="${EQ}" stroke-width="2"/>`;
  for(const [t,...v] of g.st||[]){
    if(t==='bench')o+=`<rect x="${v[0]}" y="${v[2]}" width="${v[1]-v[0]}" height="6" rx="2" fill="${EQ}"/>`+L([v[0]+6,v[2]+6],[v[0]+6,130],EQ,3)+L([v[1]-6,v[2]+6],[v[1]-6,130],EQ,3);
    else if(t==='line')o+=L([v[0],v[1]],[v[2],v[3]],EQ,v[4]||4);
    else if(t==='box')o+=`<rect x="${v[0]}" y="${v[1]}" width="${v[2]}" height="${v[3]}" rx="2" fill="${EQ}"/>`;
  }
  const d=g.dyn||{},arr=x=>x==null?[]:[].concat(x);
  if(d.cable)o+=L([d.cable[0],d.cable[1]],P[d.cable[2]],'var(--muted)',1.5);
  for(const [t,...v] of g.st||[])if(t==='anchor')o+=`<circle cx="${v[0]}" cy="${v[1]}" r="4" fill="var(--surface)" stroke="var(--muted)" stroke-width="2"/>`;
  if(P.e2)o+=L(P.s,P.e2,FAR,5)+L(P.e2,P.w2,FAR,5);
  if(P.k2)o+=L(P.p,P.k2,FAR,6)+L(P.k2,P.a2,FAR,5.5)+L(P.a2,ft(P.a2,P.k2,1),FAR,4);
  o+=L(P.p,P.k,INK,6.5)+L(P.k,P.a,INK,6)+L(P.a,P.t||ft(P.a,P.k,-1),INK,4);
  o+=L(P.s,P.p,INK,8)+L(P.s,P.h,INK,5)+`<circle cx="${f(P.h[0])}" cy="${f(P.h[1])}" r="7.5" fill="${INK}"/>`;
  for(const j of arr(d.pad))o+=`<circle cx="${f(P[j][0])}" cy="${f(P[j][1])}" r="6" fill="${EQ}" stroke="var(--muted)" stroke-width="1.5"/>`;
  if(d.vplat){const [x,y]=P[d.vplat];o+=L([x+4,y-12],[x+4,y+14],'var(--muted)',5)}
  if(d.hplat){const [x,y]=P[d.hplat];o+=L([x-18,y-3],[x+8,y-3],'var(--muted)',5)}
  if(d.plate){const [x,y]=P[d.plate];o+=L([x-6,y-12],[x+12,y+6],'var(--muted)',5)}
  o+=L(P.s,P.e,INK,5.5)+L(P.e,P.w,INK,5);
  for(const j of arr(d.db)){const [x,y]=P[j];o+=`<rect x="${f(x-9)}" y="${f(y-1.8)}" width="18" height="3.6" rx="1" fill="${AC}"/><rect x="${f(x-12)}" y="${f(y-5.5)}" width="5" height="11" rx="1.5" fill="${AC}"/><rect x="${f(x+7)}" y="${f(y-5.5)}" width="5" height="11" rx="1.5" fill="${AC}"/>`}
  for(const j of arr(d.bar)){const [x,y]=P[j];o+=`<circle cx="${f(x)}" cy="${f(y)}" r="11" fill="none" stroke="${AC}" stroke-width="4"/><circle cx="${f(x)}" cy="${f(y)}" r="2.5" fill="${AC}"/>`}
  for(const j of arr(d.hbar))o+=L([P[j][0]-10,P[j][1]],[P[j][0]+10,P[j][1]],AC,3.5);
  for(const j of arr(d.knob))o+=`<circle cx="${f(P[j][0])}" cy="${f(P[j][1])}" r="3.5" fill="${AC}"/>`;
  return o;
}
function painel(n){const g=GUIA[n];if(!g)return '';const li=a=>a.map(x=>`<li>${x}</li>`).join('');
  return `<div class="guia"><div class="gfig"><svg id="gfig" data-ex="${esc(n)}" viewBox="0 0 200 140" role="img" aria-label="Ilustração do movimento: ${esc(n)}">${figura(n,0)}</svg>
    <div class="note"><strong>Trabalha:</strong> ${g.m}</div></div>
    <div class="gtxt"><h4>Como fazer</h4><ol>${li(g.como)}</ol><h4>Dicas</h4><ul>${li(g.dicas)}</ul><h4 class="ev">Evite</h4><ul class="evite">${li(g.evite)}</ul></div></div>`}
let raf=0;const RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
function animar(){cancelAnimationFrame(raf);const el=document.getElementById('gfig');if(!el)return;const n=el.dataset.ex;
  const loop=ts=>{const s=document.getElementById('gfig');if(!s||s.dataset.ex!==n)return;let k;
    if(RM.matches)k=Math.floor(ts/1800)%2;else{let t=(ts%2800)/2800;t=t<.5?t*2:2-t*2;const u=Math.min(1,Math.max(0,(t-.12)/.76));k=.5-.5*Math.cos(Math.PI*u)}
    s.innerHTML=figura(n,k);raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop)}

/* ---------- conta e armazenamento (Supabase) ---------- */
const CFG=window.APP_CONFIG||{};
const DEMO=!(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase);
const S={docs:{},queues:{},pend:new Set(),user:null,ready:false};
let SB=null;
const cacheKey=()=>'diario-shape:'+(S.user?S.user.id:'teste');
function loadLocal(){try{S.docs=JSON.parse(localStorage.getItem(cacheKey())||'{}')||{}}catch(e){S.docs={}}}
function saveLocal(){try{localStorage.setItem(cacheKey(),JSON.stringify(S.docs))}catch(e){}}
function put(id,data){S.docs[id]=data;saveLocal();render();sync(id)}
function del(id){delete S.docs[id];saveLocal();render();sync(id)}
function sync(id){
  if(DEMO||!S.user)return;
  S.queues[id]=(S.queues[id]||Promise.resolve()).then(async()=>{
    const d=S.docs[id];
    try{const r=d?await SB.from('docs').upsert({user_id:S.user.id,id,data:d,updated_at:new Date().toISOString()})
                 :await SB.from('docs').delete().eq('user_id',S.user.id).eq('id',id);
      if(r.error)throw r.error;S.pend.delete(id)}
    catch(e){S.pend.add(id)}
    setStatus();
  });
}
function reenviar(){[...S.pend].forEach(sync)}
window.addEventListener('online',reenviar);
setInterval(()=>{if(S.pend.size)reenviar()},30000);
function setStatus(){const el=$('#status');if(!el)return;el.hidden=!DEMO&&!S.user;el.textContent=DEMO?'modo de teste':S.pend.size?'offline · salvo no aparelho':'sincronizado'}
async function carregar(){
  const {data,error}=await SB.from('docs').select('id,data');
  if(error){S.ready=true;toast('Sem conexão. Mostrando o que está salvo no aparelho.');render();return}
  const docs={};data.forEach(r=>{docs[r.id]=r.data});
  S.pend.forEach(id=>{if(S.docs[id])docs[id]=S.docs[id]});
  S.docs=docs;S.ready=true;saveLocal();render();reenviar()}
function entrouComo(u){
  if((u&&u.id)===(S.user&&S.user.id))return;
  S.user=u;S.docs={};S.pend=new Set();D.tab='hoje';D.treino=null;D.resumo=null;
  if(u){loadLocal();S.ready=!!S.docs.perfil;render();carregar()}else{S.ready=false;render()}
  setStatus();
}
async function init(){
  if(DEMO){loadLocal();S.ready=true;render();setStatus();return}
  SB=supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  SB.auth.onAuthStateChange((ev,ses)=>{entrouComo(ses?ses.user:null)});
  const {data}=await SB.auth.getSession();
  if(data.session)entrouComo(data.session.user);else render();
}
const ERR=m=>{m=String(m||'');return /Invalid login/i.test(m)?'E-mail ou senha incorretos.':/already registered/i.test(m)?'Este e-mail já tem conta. Entre com sua senha.':/at least 6/i.test(m)?'A senha precisa ter pelo menos 6 caracteres.':/not confirmed/i.test(m)?'Confirme seu e-mail pelo link que enviamos e tente de novo.':/rate limit|security purposes/i.test(m)?'Muitas tentativas. Espere um minuto e tente de novo.':/expired|invalid/i.test(m)?'Código inválido ou expirado. Peça um novo.':/fetch|network|Load failed/i.test(m)?'Sem conexão com a internet.':'Não deu certo: '+m};
async function authGo(){const A=D.auth,email=(A.email||'').trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(email)){A.erro='Digite um e-mail válido.';return render()}
  A.busy=true;A.erro='';A.ok='';A.email=email;render();let r;
  try{
    if(A.modo==='entrar')r=await SB.auth.signInWithPassword({email,password:A.senha||''});
    else if(A.modo==='criar'){r=await SB.auth.signUp({email,password:A.senha||''});if(!r.error&&!r.data.session){A.ok='Conta criada! Abra o e-mail que enviamos para confirmar e depois entre aqui.';A.modo='entrar'}}
    else if(A.modo==='esqueci'){r=await SB.auth.resetPasswordForEmail(email);if(!r.error){A.modo='codigo';A.ok='Enviamos um código para '+email+'.'}}
    else if(A.modo==='codigo'){if((A.nova||'').length<6){A.busy=false;A.erro='A senha nova precisa ter pelo menos 6 caracteres.';return render()}
      r=await SB.auth.verifyOtp({email,token:(A.codigo||'').trim(),type:'recovery'});if(!r.error){r=await SB.auth.updateUser({password:A.nova});if(!r.error)toast('Senha alterada')}}
    if(r&&r.error)A.erro=ERR(r.error.message);
  }catch(e){A.erro=ERR(e&&e.message)}
  A.busy=false;A.senha='';render()}

function ultimoEx(nome,skip){for(const t of treinos()){if(t.id===skip||t.ativo)continue;const e=(t.ex||[]).find(x=>x.nome===nome);if(e&&setsOf(e).some(x=>feito(x)&&x.reps!=null))return {e,date:t.date}}return null}
function sugestao(nome,skip){const u=ultimoEx(nome,skip);if(!u)return null;const ss=setsOf(u.e).filter(x=>feito(x)&&x.reps!=null);const top=Math.max(0,...ss.map(x=>x.kg||0));const q=fdate(u.date);
  if(top&&!isSeg(nome)&&ss.every(x=>x.reps>=12)){const inc=top<10?1:top<30?2:5;return {kg:top+inc,ant:top,ok:true,msg:`Na última vez (${q}) você fez 12 repetições em todas as séries com ${fmt(top)} kg. Carga sugerida hoje: <strong>${fmt(top+inc)} kg</strong>.`}}
  return {kg:null,ok:false,msg:`Última vez (${q}): ${setsTxt(u.e)}. Mantenha a carga até completar 12 repetições em todas as séries.`}}
function planejar(n,skip){const u=ultimoEx(n,skip),sg=sugestao(n,skip);const base=u?setsOf(u.e).filter(feito):[];const len=Math.max(3,base.length);
  return {nome:n,sets:Array.from({length:len},(_,i)=>({kg:sg&&sg.kg?sg.kg:(base[i]?base[i].kg:(base.length?base[base.length-1].kg:null)),reps:null,feito:false}))}}
function proxEx(t,from){const n=t.ex.length;for(let k=0;k<n;k++){const i=(from+k)%n;if(t.ex[i].sets.some(x=>!feito(x)))return i}return Math.max(0,Math.min(from,n-1))}

function metasMacro(P){const k=P.metaKcal,pr=P.metaProt;
  const g=P.metaGorduraG||(k?Math.round(k*0.28/9):null);
  const c=P.metaCarbo||(k&&pr&&g?Math.max(0,Math.round((k-pr*4-g*9)/4)):null);return {p:pr,c,g}}

  const rows=[['Proteína',t.p,'var(--prot)',M.p,false],['Carbo',t.c,'var(--carb)',M.c,true],['Gordura',t.g,'var(--fat)',M.g,true]];

function chart(ws,meta){
  if(ws.length<2)return `<p class="empty">O gráfico aparece a partir do segundo registro.</p>`;
  const W=600,H=220,L=40,R=14,T=14,B=26;
  const ks=ws.map(w=>w.kg).concat(meta!=null?[meta]:[]);
  let lo=Math.floor(Math.min(...ks)-1),hi=Math.ceil(Math.max(...ks)+1);
  const t0=new Date(ws[0].date).getTime(),t1=new Date(ws[ws.length-1].date).getTime()||t0+1;
  const x=d=>L+(new Date(d).getTime()-t0)/((t1-t0)||1)*(W-L-R);
  const y=k=>T+(hi-k)/(hi-lo)*(H-T-B);
  const step=Math.max(1,Math.ceil((hi-lo)/4));const ticks=[];for(let k=lo;k<=hi;k+=step)ticks.push(k);
  const pts=ws.map(w=>`${x(w.date).toFixed(1)},${y(w.kg).toFixed(1)}`);
  const last=ws[ws.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de peso">
    ${ticks.map(k=>`<line x1="${L}" x2="${W-R}" y1="${y(k)}" y2="${y(k)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(k)+4}" text-anchor="end">${k}</text>`).join('')}
    ${meta!=null?`<line x1="${L}" x2="${W-R}" y1="${y(meta)}" y2="${y(meta)}" stroke="var(--kcal)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(meta)-6}" text-anchor="end" style="fill:var(--kcal)">meta ${fmt(meta)}</text>`:''}
    <polygon points="${L},${H-B} ${pts.join(' ')} ${x(last.date)},${H-B}" fill="var(--accent)" opacity=".12"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${ws.map(w=>`<circle cx="${x(w.date)}" cy="${y(w.kg)}" r="2.5" fill="var(--accent)"/>`).join('')}
    <circle cx="${x(last.date)}" cy="${y(last.kg)}" r="5.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
    <text x="${L}" y="${H-6}">${fdate(ws[0].date)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fdate(last.date)}</text>
  </svg>`;
}

const FAIXAS={

const cortes=(tipo,sexo,idade)=>{const t=FAIXAS[tipo][sexo==='m'?'m':'f'];return (t.find(([a,b])=>idade>=a&&idade<b)||t[0])[2]};
const zona=(v,c)=>c.findIndex(x=>v<x)<0?c.length:c.findIndex(x=>v<x);
function escala(v,c,min,max,boas,rotulos){
  const z=[min,...c,max],pos=x=>Math.max(0,Math.min(100,(x-min)/(max-min)*100)),ativa=zona(v,c);
  return `<div class="esc" role="img" aria-label="${rotulos[ativa]}">${z.slice(0,-1).map((a,i)=>`<span class="${boas.includes(i)?'bom':''} ${i===ativa?'on':''}" style="width:${pos(z[i+1])-pos(a)}%"></span>`).join('')}<b style="left:${pos(v)}%"></b></div>
    <div class="esc-l">${c.map(x=>`<span style="left:${pos(x)}%">${fmt(x)}</span>`).join('')}</div>`}

      const novo={id,nome,k:fx(F.ck),p:fx(F.cP),c:fx(F.cc),g:fx(F.cg),u:por!==100||cu?[[cu||'porção',por]]:[]};
      put('alimentos',{kind:'alimentos',itens:[...meusAlim(),novo]});Object.assign(D.food,{custom:false,q:'',sel:id,editId:'',n:novo.u.length?'1':'100',med:novo.u.length?'1':'0'});render();toast('Alimento cadastrado')},
    addFood(){const F=D.food,f=alim(F.sel);if(!f)return;const qt=gramas(f,F.n,F.med);if(!qt||qt<=0)return toast('Informe a quantidade.');
      const m=macro(f,qt),doc=diaComida(F.day);
      const it={id:F.editId||rid(),ref:F.ref,fid:f.id,nome:f.nome,n:num(F.n),med:+F.med||0,qt:Math.round(qt*10)/10,kcal:m.kcal,p:m.p,c:m.c,g:m.g};
      const itens=F.editId?doc.itens.map(i=>i.id===F.editId?it:i):[...doc.itens,it];
      Object.assign(D.food,{sel:'',q:'',editId:''});put('c_'+F.day,{kind:'comida',date:F.day,itens});toast((F.editId?'Alterado: ':'Adicionado: ')+qtTxt(it)+' de '+f.nome.toLowerCase())},
    quick(){const f=alim(arg),l=usos()[arg]?.last;if(!f||!l)return;const qt=l.qt??gramas(f,l.n,l.med);const m=macro(f,qt),F=D.food,doc=diaComida(F.day);
      const it={id:rid(),ref:F.ref,fid:f.id,nome:f.nome,n:l.n,med:l.med||0,qt,kcal:m.kcal,p:m.p,c:m.c,g:m.g};put('c_'+F.day,{kind:'comida',date:F.day,itens:[...doc.itens,it]});toast('Adicionado em '+F.ref+': '+f.nome)},
    editFood(){const i=diaComida(D.food.day).itens.find(x=>x.id===arg);if(!i||!alim(i.fid))return toast('Este alimento não está mais na base. Apague e adicione de novo.');
      Object.assign(D.food,{sel:i.fid,n:s2(i.n??i.qt),med:String(i.n!=null?(i.med||0):0),editId:i.id,ref:i.ref,custom:false});render();document.getElementById('addcard')?.scrollIntoView({behavior:'smooth',block:'start'})},
    repetir(){const F=D.food,ont=diaComida(addDays(F.day,-1)).itens.filter(i=>i.ref===F.ref);if(!ont.length)return;const doc=diaComida(F.day);
      put('c_'+F.day,{kind:'comida',date:F.day,itens:[...doc.itens,...ont.map(i=>({...i,id:rid()}))]});toast(F.ref+' repetido do dia anterior')},
    delFood(){const doc=diaComida(D.food.day);const itens=doc.itens.filter(i=>i.id!==arg);
      itens.length?put('c_'+D.food.day,{...doc,itens}):del('c_'+D.food.day);toast('Apagado')},
    aplicarMetas(){const A=analise();if(!A)return;const P=perfil();put('perfil',{...P,metaKcal:A.kcal,metaProt:A.prot,metaPeso:A.pesoAlvo||P.metaPeso,metaGord:A.zg>=2?A.alvoG:(P.metaGord??null)});D.perfil=null;render();toast('Metas atualizadas')},
    savePerfil(){const p=D.perfil;put('perfil',{...perfil(),nome:(p.nome||'').trim(),altura:num(p.altura),idade:num(p.idade),sexo:p.sexo||'f',pesoInicial:num(p.pesoInicial),metaPeso:num(p.metaPeso),metaKcal:num(p.metaKcal),metaProt:num(p.metaProt),metaGord:num(p.metaGord),metaCarbo:num(p.metaCarbo),metaGorduraG:num(p.metaGorduraG),inicio:p.inicio||null});
      D.perfil=null;render();toast('Metas salvas')}
  };
  A[act]&&A[act]();
});
// hora de refeição padrão pelo horário
(()=>{const h=new Date().getHours();D.food.ref=h<10?'Café da manhã':h<15?'Almoço':h<18?'Lanche':h<22?'Jantar':'Ceia'})();
init();
</script>
